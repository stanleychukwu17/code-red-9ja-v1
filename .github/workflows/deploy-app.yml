name: Deploy Application

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write # Required for requesting the AWS JWT (OIDC)
  contents: read  # Required for actions/checkout

jobs:
  deploy-backend:
    name: Deploy Go Backend (AWS ECS)
    runs-on: ubuntu-latest

    env:
      TARGET_ENV: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', env.TARGET_ENV)] }}
          aws-region: af-south-1
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: free9ja-${{ env.TARGET_ENV }}-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./apps/api
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Download Active Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition free9ja-${{ env.TARGET_ENV }}-api \
            --query taskDefinition > task-def.json

      # Removes metadata fields from task-def that would cause registration to fail
      - name: Clean Task Definition
        run: |
          jq '. | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-def.json > clean-task-def.json

      - name: Render task definition with new image tag
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: clean-task-def.json
          container-name: api
          image: ${{ steps.login-ecr.outputs.registry }}/free9ja-${{ env.TARGET_ENV }}-api:${{ github.sha }}

      - name: Deploy to AWS ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: free9ja-${{ env.TARGET_ENV }}-api-service
          cluster: free9ja-${{ env.TARGET_ENV }}-cluster
          wait-for-service-stability: true

  deploy-frontend:
    name: Deploy React Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest

    env:
      TARGET_ENV: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Compile frontend using Nitro's cloudflare-pages preset override
      - name: Build Web Application
        env:
          NITRO_PRESET: cloudflare-pages
        run: pnpm --filter web build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/.output/public --project-name=free9ja-${{ env.TARGET_ENV }}-web
