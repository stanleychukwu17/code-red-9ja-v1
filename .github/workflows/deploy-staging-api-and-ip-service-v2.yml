name: Deploy Staging v2 (EC2)

on:
  push:
    branches:
      - staging
    paths:
      - "apps/api/**"
      - "apps/ip-service/**"
      - ".github/workflows/deploy-staging-api-and-ip-service-v2.yml"
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting the AWS JWT (OIDC)
  contents: read # Required for actions/checkout

jobs:
  deploy-staging-v2:
    name: Deploy to EC2 Staging v2
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: staging-v2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configure AWS Credentials using OIDC (OpenID Connect)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING_V2 }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      # Login to Amazon ECR to push Docker images
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push API Service
      - name: Build and Push API Service Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: free9ja-${{ env.ENVIRONMENT }}-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./apps/api
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Build and push IP Service
      - name: Build and Push IP Service Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: free9ja-${{ env.ENVIRONMENT }}-ip-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./apps/ip-service
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Retrieve the EC2 instance ID by tags
      - name: Discover EC2 Instance
        id: discover-ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=${{ env.ENVIRONMENT }}" "Name=tag:Name,Values=free9ja-${{ env.ENVIRONMENT }}-ec2" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ]; then
            echo "Error: No running EC2 instance found with tags Environment=${{ env.ENVIRONMENT }} and Name=free9ja-${{ env.ENVIRONMENT }}-ec2"
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found instance: $INSTANCE_ID"

      # Wait for the SSM agent to register and become online
      - name: Wait for SSM Agent to be Ready
        env:
          INSTANCE_ID: ${{ steps.discover-ec2.outputs.INSTANCE_ID }}
        run: |
          echo "Waiting for SSM Agent on instance $INSTANCE_ID to become Online..."

          # Max wait time: 10 minutes (60 * 10s)
          MAX_RETRIES=60
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Check ping status of the instance in SSM
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)
            
            if [ "$STATUS" = "Online" ]; then
              echo "SSM Agent is Online! Ready for deployment."
              exit 0
            fi
            
            echo "Current SSM agent status: ${STATUS:-Not Registered Yet}. Retrying in 10 seconds... ($((RETRY_COUNT+1))/$MAX_RETRIES)"
            sleep 10
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done

          echo "Error: SSM Agent did not register as Online within the timeout period."
          exit 1

      # Execute Deployment commands on the EC2 instance via AWS Systems Manager (SSM)
      - name: Deploy Containers via SSM Run Command
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          INSTANCE_ID: ${{ steps.discover-ec2.outputs.INSTANCE_ID }}
        run: |
          echo "Sending deployment command to instance $INSTANCE_ID..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"cd /app\",
              \"docker compose pull api ip-service\",
              \"docker compose up -d api ip-service\",
              \"systemctl reload nginx\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent. Command ID: $COMMAND_ID"
          echo "Waiting for command execution to complete..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "SSM Command execution completed successfully!"
