name: Deploy Infrastructure

on:
  push:
    paths:
      - 'terraform/**'
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    # Map the git branch or manual selection to target environment
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
      TF_ACTION: ${{ github.event.inputs.action || 'apply' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: |
          cd terraform/environments/${{ env.TARGET_ENV }}
          terraform init

      - name: Terraform Format Check
        run: |
          cd terraform/environments/${{ env.TARGET_ENV }}
          terraform fmt -check -recursive ../../

      - name: Terraform Plan
        if: env.TF_ACTION == 'plan' || github.event_name == 'pull_request'
        run: |
          cd terraform/environments/${{ env.TARGET_ENV }}
          terraform plan -no-color

      - name: Terraform Apply
        if: env.TF_ACTION == 'apply' && github.event_name != 'pull_request'
        run: |
          cd terraform/environments/${{ env.TARGET_ENV }}
          terraform apply -auto-approve
