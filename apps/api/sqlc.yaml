version: "2"
sql:
  - schema: "db/migrations"  # sqlc reads your .sql migrations to know the table types
    queries: "db/query"      # where your query files live
    engine: "postgresql"
    gen:
      go:
        package: "queries"   # name of the generated package
        out: "internal/db/queries"
        sql_package: "pgx/v5" # essential for using pgxpool
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true # makes it easier to mock for tests
        rename:
          polling_unit_consensus: "PollingUnitConsensus"
        overrides:
          - column: "*.senatorial_districts_count"
            go_type: "int32"
          - column: "*.federal_constituencies_count"
            go_type: "int32"
          - column: "*.state_constituencies_count"
            go_type: "int32"
          - column: "*.lgas_count"
            go_type: "int32"
          - column: "*.wards_count"
            go_type: "int32"
          - column: "*.polling_units_count"
            go_type: "int32"
          - column: "*.state_supervisors_count"
            go_type: "int32"
          - column: "*.unique_state_supervisors_count"
            go_type: "int32"
          - column: "*.total_state_supervisors_count"
            go_type: "int32"
          - column: "*.lga_supervisors_count"
            go_type: "int32"
          - column: "*.unique_lga_supervisors_count"
            go_type: "int32"
          - column: "*.total_lga_supervisors_count"
            go_type: "int32"
          - column: "*.ward_supervisors_count"
            go_type: "int32"
          - column: "*.unique_ward_supervisors_count"
            go_type: "int32"
          - column: "*.total_ward_supervisors_count"
            go_type: "int32"
          - column: "*.states_count"
            go_type: "int32"
          - column: "*.unique_pu_agents_count"
            go_type: "int32"
