version: "3.8"
name: free9ja_redis_postgres

services:
  redis_free9ja:
    image: redis:7.2.13-alpine
    container_name: redis_free9ja
    hostname: redis_free9ja
    env_file:
      - .env
      - .env.local
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - free9ja_network
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  postgres_free9ja:
    container_name: postgres_free9ja
    hostname: postgres_free9ja
    image: postgres:16.3-alpine3.20
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - free9ja_network

  pgadmin_free9ja:
    container_name: pgadmin_free9ja
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@free9ja.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - free9ja_network
    depends_on:
      - postgres_free9ja

networks:
  free9ja_network:
    driver: bridge

volumes:
  redis_data:
  pg_data:
  pgadmin_data:
