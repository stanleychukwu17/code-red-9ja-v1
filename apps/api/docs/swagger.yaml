            additionalProperties: true
            type: object
      summary: Update global slot price
      tags:
      - Admin Settings
  /admin/users/{id}/phones:
    get:
      description: Fetches the list of phone numbers for a user
      parameters:
      - description: User ID or Fake ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user phone numbers
      tags:
      - Users
