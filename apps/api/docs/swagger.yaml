      iso2:
        type: string
      name:
        type: string
      phone_code:
        type: string
    type: object
  countrieshandler.GetCountriesResponse:
    properties:
      countries:
        items:
          $ref: '#/definitions/countrieshandler.CountryResponse'
        type: array
    type: object
host: localhost:4000
info:
