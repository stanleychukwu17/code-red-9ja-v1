paths:
  /admin/parties/{id}/discount:
    put:
      consumes:
      - application/json
      description: Sets the slot discount percentage for a political party (Admin
        only)
      parameters:
      - description: Party ID
        in: path
        name: id
        required: true
        type: integer
      - description: Discount request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/partieshandler.SetPartyDiscountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Party discount updated
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Set customized slot discount for a party
      tags:
      - Admin Parties
  /admin/settings/slot-price:
    get:
      description: Retrieves the global, app-wide price of a single polling unit slot
        in Kobo
      produces:
      - application/json
      responses:
        "200":
          description: Global slot price retrieved
          schema:
            additionalProperties: true
            type: object
      summary: Get global slot price
      tags:
      - Admin Settings
    put:
      consumes:
      - application/json
      description: Updates the global, app-wide price of a single polling unit slot
        in Kobo (Admin only)
      parameters:
