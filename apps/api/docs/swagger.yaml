paths:
  /admin/agent-marketing-campaigns:
    get:
      description: Returns a paginated list of all party marketing campaigns with
        party, plan, election_group, and election details
      parameters:
      - description: Party ID filter
        in: query
        name: party_id
        type: integer
      - description: Election Group ID filter
        in: query
        name: election_group_id
        type: integer
      - description: Status filter
        in: query
        name: status
        type: string
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      - description: Cursor (ID)
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Marketing campaigns retrieved successfully
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all party marketing campaigns (Admin)
      tags:
      - Marketing
  /admin/agent-marketing-campaigns/{id}:
    delete:
      description: Deletes a marketing campaign by ID
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Marketing campaign deleted successfully
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete marketing campaign (Admin)
      tags:
      - Marketing
  /admin/agent-marketing-campaigns/{id}/status:
    patch:
      consumes:
      - application/json
      description: Updates a marketing campaign status (e.g. active, inactive, completed).
        When set to active, sets start_date to today, end_date to start_date + duration,
        and deducts budget_per_day to amount_spent.
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: integer
      - description: Status payload e.g. {\
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Marketing campaign status updated successfully
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update marketing campaign status (Admin)
      tags:
      - Marketing
  /admin/inec-result-grabber-logs:
    get:
      consumes:
      - application/json
      description: Retrieves paginated execution logs across grabbers
      parameters:
      - description: Filter by grabber ID
        in: query
        name: grabber_id
        type: integer
      - description: Limit results (default 20)
        in: query
        name: limit
        type: integer
      - description: Cursor for pagination
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Logs retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all INEC result grabber logs
      tags:
      - INEC Result Grabber
  /admin/inec-result-grabbers:
    get:
      consumes:
      - application/json
      description: Retrieves paginated INEC result grabbers with election details
        and metrics
      parameters:
      - description: Limit results (default 20)
        in: query
        name: limit
        type: integer
      - description: Cursor for pagination
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: INEC result grabbers retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List INEC result grabbers
      tags:
      - INEC Result Grabber
  /admin/inec-result-grabbers/{id}/logs:
    get:
      consumes:
      - application/json
      description: Retrieves paginated execution logs for a specific INEC result grabber
      parameters:
      - description: INEC Result Grabber ID
        in: path
        name: id
        required: true
        type: integer
      - description: Limit results (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset results (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Logs retrieved successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid grabber ID
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List INEC result grabber sync logs
      tags:
      - INEC Result Grabber
  /admin/inec-result-grabbers/{id}/sync:
    post:
      consumes:
      - application/json
      description: Triggers a manual sync run for the specified INEC result grabber
      parameters:
      - description: INEC Result Grabber ID
        in: path
        name: id
        required: true
        type: integer
      - description: Upload result sheet images to R2 (default from config)
        in: query
        name: upload_to_r2
        type: boolean
      - description: Extract candidate results via AI (default from config)
        in: query
        name: ai_extract
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Sync completed successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request params
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Manually trigger INEC result grabber sync
      tags:
      - INEC Result Grabber
  /admin/inec-result-grabbers/{id}/toggle-pause:
    post:
      parameters:
      - description: INEC Result Grabber ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Toggle pause/resume status of INEC result grabber
      tags:
      - INEC Result Grabber
  /admin/parties/{id}/discount:
    put:
      consumes:
      - application/json
      description: Sets the slot discount percentage for a political party (Admin
